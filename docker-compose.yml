
services:

  postgres:
    image: postgres:16-alpine
    container_name: criaquiz-db
    environment:
      POSTGRES_DB: criaquiz
      POSTGRES_USER: criaquiz_user
      POSTGRES_PASSWORD: criaquiz_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U criaquiz_user -d criaquiz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: criaquiz-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/criaquiz
      SPRING_DATASOURCE_USERNAME: criaquiz_user
      SPRING_DATASOURCE_PASSWORD: criaquiz_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
spring.application.name=backend

spring.application.name=criaquiz

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/criaquiz}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:criaquiz_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:criaquiz_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

anthropic.api.key=${ANTHROPIC_API_KEY:}
